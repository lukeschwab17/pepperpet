<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pepper Update!</title>
  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body class="bg-light d-flex flex-column justify-content-center align-items-center min-vh-100 text-center">
  <div class="container">
    {% if is_video %}
      <video controls autoplay src="{{ mediapath }}" alt="Pepper" class="img-fluid mb-4" style="max-height: 500px"></video>
    {% else %}
      <img src="{{ mediapath }}" alt="Pepper" class="img-fluid mb-4" style="max-height: 500px"/>
    {% endif %}
    <h1 class="text-dark mb-3">Cat Update!</h1>
    <a href="{{ url_for('download') }}" download class="btn btn-primary btn-lg">Download Update</a>
  </div>

  <!-- Bootstrap JS (Optional for interactive components) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
